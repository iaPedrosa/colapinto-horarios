name: probe-livetiming
on:
  push:
    branches: [probe-livetiming]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://livetiming.formula1.com/static
          curl -sS $B/2026/Index.json -o idx.json; head -c 300 idx.json; echo
          python3 - <<'PY'
          import json
          d=json.load(open('idx.json', encoding='utf-8-sig'))
          m=[x for x in d['Meetings'] if 'United' in x['Name']][-1]
          print({k:v for k,v in m.items() if k!='Sessions'})
          for s in m['Sessions']: print(json.dumps(s))
          open('path.txt','w').write([s for s in m['Sessions'] if s.get('Name')=='Practice 1'][0]['Path'])
          PY
          P=$(cat path.txt); echo "PATH=$P"
          for f in Index.json ArchiveStatus.json SessionStatus.json SessionInfo.json TimingData.json TimingData.jsonStream TimingAppData.json DriverList.json SessionData.json; do
            echo "== $f"; curl -sSI "$B/$P$f" | grep -iE '^(HTTP|last-modified|content-length|date|cache-control|etag)'
          done
          echo "== ArchiveStatus"; curl -sS "$B/${P}ArchiveStatus.json"; echo
          echo "== SessionStatus"; curl -sS "$B/${P}SessionStatus.json"; echo
          echo "== SessionInfo"; curl -sS "$B/${P}SessionInfo.json"; echo
          echo "== SessionData"; curl -sS "$B/${P}SessionData.json" | head -c 1500; echo
          echo "== TimingData 43/10"; curl -sS "$B/${P}TimingData.json" | python3 -c "import json,sys;d=json.loads(sys.stdin.read().lstrip('﻿'));L=d['Lines'];print(list(d.keys()));[print(k,json.dumps({x:L[k].get(x) for x in ('Position','Line','Retired','Stopped','InPit','ShowPosition','BestLapTime','KnockedOut')})) for k in ('43','10')]"
          echo "== tail of stream"; curl -sS "$B/${P}TimingData.jsonStream" | tail -c 600; echo
          echo "== SessionStatus stream"; curl -sS "$B/${P}SessionStatus.jsonStream"
