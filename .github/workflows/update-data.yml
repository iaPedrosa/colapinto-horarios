# Guarda los datos de las APIs en data/. Vercel publica la página sola con cada commit.
#
# - En fin de semana de carrera (viernes a lunes, hora UTC): cada 30 minutos.
# - El resto de la semana: una vez por día.
# - También se puede correr a mano desde la pestaña Actions ("Run workflow").
name: Datos

on:
  schedule:
    - cron: '*/30 * * * 5,6,0,1'
    - cron: '17 12 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Descargar datos
        run: node scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Datos actualizados"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios en los datos."
          fi
