<script>
// iPhone, app agregada al inicio: a veces iOS le da a la página una ventana más baja que la pantalla
// y queda un hueco vacío abajo. En ese caso se estira el html al alto real de la pantalla.
if (navigator.standalone) {
  const fullH = () => {
    const land = innerWidth > innerHeight;
    const full = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    document.documentElement.style.height = innerHeight < full ? full + 'px' : '';
  };
  fullH();
  addEventListener('resize', fullH);
}
</script>

<style>
  :root {
    --navy: #04142B;
    --card: #0A2245;
    --card-2: #0E3366;
    --deep: #0A2A52;
    --blue: #0090FF;
    --pink: #FF87BC;
    --celeste: #74ACDF;
    --white: #FFFFFF;
    --nav-h: 84px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #020B18; color: var(--white); }
  body {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  nav button { touch-action: manipulation; }

  /* ---------- escenario ---------- */
  .stage {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 16px 0;
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    touch-action: pan-y;
  }
  .frame { position: relative; flex-shrink: 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .poster {
    position: absolute; left: 0; top: 0; width: 1080px; height: 1350px;
    transform-origin: 0 0; overflow: hidden; background: var(--navy);
  }

  /* ---------- placa ---------- */
  .big43 {
    position: absolute; top: -40px; right: -60px; font-weight: 900; font-style: italic;
    font-size: 640px; line-height: .8; letter-spacing: -.04em; color: var(--deep);
  }
  .stripe { position: absolute; left: 0; top: 0; width: 100%; height: 14px; display: flex; }
  .stripe span { flex: 1; }
  .lines { position: absolute; left: 0; bottom: 110px; }
  .content { position: relative; padding: 84px 80px 0; display: flex; flex-direction: column; }
  .kicker { font-weight: 700; font-size: 26px; letter-spacing: .28em; color: var(--celeste); }
  .name {
    margin-top: 22px; font-weight: 900; font-style: italic; font-size: 132px; line-height: .86;
    letter-spacing: -.01em; text-transform: uppercase;
  }
  .gp-row { margin-top: 28px; display: flex; align-items: center; gap: 18px; }
  .gp-tag {
    background: var(--pink); color: var(--navy); font-weight: 800; font-size: 34px;
    letter-spacing: .06em; padding: 6px 20px; transform: skewX(-12deg); white-space: nowrap;
  }
  .gp-dates { font-weight: 600; font-size: 34px; letter-spacing: .06em; white-space: nowrap; }
  .sub {
    margin-top: 22px; display: flex; align-items: center; gap: 12px; font-weight: 700;
    font-size: 24px; letter-spacing: .2em; color: var(--celeste);
  }
  .days { margin-top: 46px; display: flex; flex-direction: column; gap: 14px; }
  .days.compact { margin-top: 40px; gap: 12px; }
  .day { display: flex; align-items: stretch; background: var(--card); }
  .day-badge {
    width: 150px; flex-shrink: 0; background: var(--card-2); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 14px 0;
  }
  .dow { font-weight: 700; font-size: 22px; letter-spacing: .2em; color: var(--celeste); }
  .dnum { font-weight: 900; font-size: 56px; line-height: 1; }
  .sessions { flex: 1; display: flex; flex-direction: column; }
  .session { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; }
  .session + .session { border-top: 2px solid var(--navy); }
  .s-name { font-weight: 700; font-size: 38px; letter-spacing: .02em; }
  .s-time { font-weight: 800; font-size: 46px; }
  .race { display: flex; align-items: stretch; background: var(--blue); color: var(--navy); }
  .race .day-badge { background: var(--pink); padding: 18px 0; }
  .race .dow { color: var(--navy); font-weight: 800; }
  .race-body { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 22px 32px; }
  .race-kicker { font-weight: 700; font-size: 22px; letter-spacing: .24em; }
  .race-title { font-weight: 900; font-style: italic; font-size: 58px; line-height: 1; text-transform: uppercase; }
  .race-time { font-weight: 900; font-size: 84px; line-height: 1; }
  .footer {
    position: absolute; left: 80px; right: 80px; bottom: 56px; display: flex;
    justify-content: space-between; align-items: flex-end;
  }
  .vamos { font-weight: 800; font-style: italic; font-size: 40px; letter-spacing: .04em; }
  .sign { font-weight: 600; font-size: 22px; letter-spacing: .18em; color: var(--celeste); }

  /* ---------- navegación ---------- */
  nav {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 16px calc(8px + env(safe-area-inset-bottom));
  }
  .ctrls { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; max-width: 560px; }
  .ctrls .where { flex: 1; }
  nav button {
    width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--celeste);
    background: transparent; color: var(--white); cursor: pointer; display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  nav button:hover:not(:disabled) { background: var(--card-2); border-color: var(--pink); }
  nav button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  nav button:disabled { opacity: .3; cursor: default; }
  .where { min-width: 0; text-align: center; line-height: 1.15; }
  .where-gp { font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where-meta { font-weight: 600; font-size: 14px; letter-spacing: .18em; color: var(--celeste); }
  .where-meta b { color: var(--pink); font-weight: 800; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: #2A4A75; }
  .dots span.on { background: var(--pink); width: 18px; border-radius: 3px; }
  /* ---------- selector resultados / horarios ---------- */
  .seg { display: flex; padding: 3px; border-radius: 999px; background: #0A2245; width: max-content; max-width: 100%; }
  .seg button[hidden] { display: none; }
  .seg button {
    width: auto; height: 34px; border: 0; border-radius: 999px; padding: 0 16px; font: 700 15px/1 'Barlow Condensed', sans-serif;
    letter-spacing: .12em; color: var(--celeste); background: transparent;
  }
  nav .seg button[aria-pressed="true"] { background: var(--pink); color: var(--navy); }
  nav .seg button:hover:not([aria-pressed="true"]) { background: var(--card-2); }

  /* ---------- placa de resultados ---------- */
  .content.res { padding-top: 72px; }
  .content.res .name { font-size: 92px; line-height: .9; margin-top: 14px; white-space: nowrap; }
  .content.res .gp-row { margin-top: 18px; }
  .r-hero { margin-top: 22px; display: flex; align-items: center; gap: 36px; }
  .r-pos { font-weight: 900; font-style: italic; font-size: 160px; line-height: .85; color: var(--pink); letter-spacing: -.02em; }
  .r-hero-side { display: flex; flex-direction: column; gap: 10px; font-weight: 700; font-size: 32px; letter-spacing: .08em; color: var(--celeste); }
  .r-hero-side b { color: var(--white); }
  .r-pts { font-weight: 900; font-size: 50px; letter-spacing: .02em; color: var(--white); }
  .r-tiles { margin-top: 22px; display: grid; gap: 10px; }
  .r-tile { background: var(--card); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .r-tile div { font-weight: 700; font-size: 17px; letter-spacing: .12em; color: var(--celeste); white-space: nowrap; }
  .r-tile b { font-weight: 800; font-size: 36px; white-space: nowrap; }
  .r-label { margin-top: 20px; margin-bottom: 8px; font-weight: 700; font-size: 20px; letter-spacing: .24em; color: var(--celeste); }
  .r-tyres { display: flex; gap: 4px; height: 50px; }
  .r-tyre { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 14px; min-width: 38px; overflow: hidden; }
  .r-tyre b { font-weight: 900; font-size: 30px; }
  .r-tyre span { font-weight: 700; font-size: 20px; white-space: nowrap; }
  .r-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(5, auto); column-gap: 10px; row-gap: 6px; }
  .r-row { background: var(--card); padding: 4px 16px; font-weight: 700; font-size: 24px; letter-spacing: .04em; display: flex; gap: 14px; }
  .r-row span { width: 58px; color: var(--celeste); }
  .r-row.me { background: var(--pink); color: var(--navy); }
  .r-row.me span { color: var(--navy); }
  .r-row.wide { grid-column: 1 / -1; grid-row: 6; }
  .r-msg { margin-top: 60px; display: flex; flex-direction: column; gap: 18px; }
  .r-msg b { font-weight: 900; font-style: italic; font-size: 72px; line-height: .95; text-transform: uppercase; }
  .r-msg span { font-weight: 600; font-size: 32px; letter-spacing: .04em; color: var(--celeste); max-width: 820px; }
  .r-src { position: absolute; right: 80px; bottom: 26px; font-weight: 600; font-size: 16px; letter-spacing: .16em; color: #4F78A8; }

  .poster.m .content { padding: 60px 40px 0; }
  .poster.m .footer { left: 40px; right: 40px; bottom: 44px; }
  .poster.m .lines { bottom: 96px; }
  .poster.m .big43 { font-size: 520px; right: -70px; }
  .poster.m .kicker { font-size: 22px; letter-spacing: .16em; }
  .poster.m .name { font-size: 124px; }
  .poster.m .gp-row { flex-wrap: wrap; row-gap: 12px; }
  .poster.m .gp-tag, .poster.m .gp-dates { font-size: 36px; }
  .poster.m .sub { font-size: 22px; letter-spacing: .12em; align-items: flex-start; }
  .poster.m .day-badge { width: 116px; }
  .poster.m .session { padding: 18px 22px; }
  .poster.m .s-name { font-size: 40px; }
  .poster.m .s-time { font-size: 50px; }
  .poster.m .race-body { padding: 24px 22px; }
  .poster.m .race-time { font-size: 92px; }
  .poster.m .content.res .name { font-size: 80px; }
  .poster.m .r-hero { gap: 24px; }
  .poster.m .r-pos { font-size: 176px; }
  .poster.m .r-hero-side { font-size: 30px; }
  .poster.m .r-pts { font-size: 54px; }
  .poster.m .r-tiles { grid-template-columns: repeat(var(--tile-cols, 2), minmax(0, 1fr)) !important; }
  .poster.m .r-tile div { font-size: 18px; }
  .poster.m .r-tile b { font-size: 42px; }
  .poster.m .r-label { font-size: 22px; margin-top: 26px; }
  .poster.m .r-tyres { height: 60px; }
  .poster.m .r-tyre b { font-size: 34px; }
  .poster.m .r-row { font-size: 28px; padding: 6px 14px; }
  .poster.m .r-row span { width: 60px; }
  .poster.m .r-msg b { font-size: 84px; }
  .poster.m .r-msg span { font-size: 34px; }
  .poster.m .r-src { right: 40px; bottom: 16px; }

  /* ---------- temporada ---------- */
  .sz-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); --tile-cols: 3; }
  .poster.m .sz-tiles { --tile-cols: 2; }
  .du { display: flex; flex-direction: column; gap: 12px; }
  .du-row { background: var(--card); padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  .du-vals { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .du-vals span { font-weight: 700; font-size: 20px; letter-spacing: .16em; color: var(--celeste); text-align: center; }
  .du-vals b { font-weight: 900; font-size: 40px; line-height: 1; min-width: 90px; }
  .du-a { color: var(--pink); }
  .du-b { color: var(--celeste); text-align: right; }
  .du-bar { height: 8px; background: var(--celeste); }
  .du-bar i { display: block; height: 100%; background: var(--pink); }
  .sz-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: -2px 0 12px; font-weight: 700; font-size: 18px; letter-spacing: .12em; color: var(--celeste); }
  .sz-legend span { display: flex; align-items: center; gap: 8px; }
  .sz-legend i { width: 18px; height: 18px; background: var(--card-2); border: 2px solid #2A4A75; }
  .sz-legend i.pts { background: var(--pink); border-color: var(--pink); }
  .sz-legend i.out { background: var(--card); border-color: #6F8BB0; border-style: dashed; }
  .poster.m .sz-legend { font-size: 20px; }
  .sz-chips { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .poster.m .sz-chips { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sz-chip { background: var(--card); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sz-chip span { font-weight: 700; font-size: 16px; letter-spacing: .12em; color: var(--celeste); }
  .sz-chip b { font-weight: 900; font-size: 30px; }
  .sz-chip.pts { background: var(--pink); color: var(--navy); }
  .sz-chip.pts span { color: var(--navy); }
  .sz-chip.out b { color: #6F8BB0; }
  .poster.m .du-vals b { font-size: 46px; }
  .poster.m .du-vals span { font-size: 20px; }
  .poster.m .sz-chip b { font-size: 34px; }

  /* ---------- cuenta regresiva ---------- */
  .cd {
    margin-top: 30px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--card-2); padding: 16px 26px;
  }
  .cd-label { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 24px; letter-spacing: .14em; color: var(--celeste); min-width: 0; }
  .cd-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pink); flex-shrink: 0; }
  .cd-time { font-weight: 900; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cd.live { background: var(--pink); color: var(--navy); }
  .cd.live .cd-label { color: var(--navy); }
  .cd.live .cd-dot { background: var(--navy); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .cd.live .cd-dot { animation: none; } }
  .days.with-cd { margin-top: 22px; }
  .session.done { opacity: .4; }
  .session.next .s-time { color: var(--pink); }
  .session.live { background: var(--pink); color: var(--navy); }
  .poster.m .cd { flex-direction: column; align-items: flex-start; gap: 8px; padding: 18px 22px; }
  .poster.m .cd-label { font-size: 24px; }
  .poster.m .cd-time { font-size: 64px; }

  /* ---------- tabla del campeonato ---------- */
  .st-cols { margin-top: 30px; display: grid; gap: 34px; grid-template-columns: minmax(0, 1fr); }
  .st-cols.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; }
  .st-list { display: flex; flex-direction: column; gap: 5px; }
  .st-row { position: relative; display: flex; align-items: center; gap: 12px; background: var(--card); padding: 7px 14px; overflow: hidden; }
  .st-bar { position: absolute; left: 0; top: 0; bottom: 0; background: #12345F; }
  .st-row > *:not(.st-bar) { position: relative; }
  .st-pos { width: 34px; flex-shrink: 0; font-weight: 800; font-size: 22px; color: var(--celeste); }
  .st-who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.05; }
  .st-who b { font-weight: 800; font-size: 25px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-who span { font-weight: 600; font-size: 16px; letter-spacing: .08em; color: var(--celeste); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-pts { font-weight: 900; font-size: 28px; white-space: nowrap; }
  .st-pts small { font-weight: 700; font-size: 15px; letter-spacing: .1em; color: var(--celeste); margin-left: 4px; }
  .st-row.me { background: var(--pink); color: var(--navy); }
  .st-row.me .st-bar { background: #FFA8CF; }
  .st-row.me .st-pos, .st-row.me .st-who span, .st-row.me .st-pts small { color: var(--navy); }
  .st-row.team { background: #0067C2; }
  .st-row.team .st-bar { background: var(--blue); }
  .st-row.team .st-pos, .st-row.team .st-who span, .st-row.team .st-pts small { color: #DDEBFF; }
  .poster.m .st-who b { font-size: 30px; }
  .poster.m .st-who span { font-size: 18px; }
  .poster.m .st-pos { font-size: 26px; width: 42px; }
  .poster.m .st-pts { font-size: 32px; }
  .poster.m .st-row { padding: 9px 16px; }
  .content.st .name { white-space: nowrap; }

  /* ---------- resultado de Franco en cada sesión ---------- */
  .s-right { display: flex; align-items: center; gap: 18px; }
  .s-res { background: var(--pink); color: var(--navy); font-weight: 900; font-size: 30px; padding: 2px 12px; transform: skewX(-12deg); }
  .session.done .s-name, .session.done .s-time { opacity: .4; }
  .session.done { opacity: 1; }
  .poster.m .s-res { font-size: 34px; }
  .race .s-res { background: var(--navy); color: var(--pink); font-size: 40px; }

  /* ---------- columnas: en celular y pantalla angosta no cambian nada ---------- */
  .hd, .ca, .cb, .full { display: contents; }
  /* Pantalla ancha (computadora): la placa ocupa todo el ancho, en dos columnas. */
  .poster.w .content {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 100px;
    align-items: start; padding: 76px 110px 0;
  }
  .poster.w .hd, .poster.w .full { display: block; grid-column: 1 / -1; min-width: 0; }
  .poster.w .ca { display: block; grid-column: 1; min-width: 0; }
  .poster.w .cb { display: block; grid-column: 2; min-width: 0; }
  .poster.w .footer { left: 110px; right: 110px; }
  .poster.w .r-src { right: 110px; }
  .poster.w .big43 { font-size: 860px; right: -40px; top: -60px; }
  .poster.w .name { font-size: 150px; }
  .poster.w .content.res .name { font-size: 110px; }
  .poster.w .cb .days { margin-top: 10px; }
  .poster.w .cb > .r-label:first-child { margin-top: 26px; }
  .poster.w .r-msg { margin-top: 40px; }
  .st-cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; }

  /* ---------- información (texto para leer y para Google) ---------- */
  .info {
    width: 100%; max-width: 1100px; padding: 44px 4px calc(56px + env(safe-area-inset-bottom));
    font-weight: 600; font-size: 20px; line-height: 1.4; letter-spacing: .01em; color: #D6E6F7;
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  .info h1 { margin: 0 0 14px; font-weight: 900; font-style: italic; font-size: 40px; line-height: 1; text-transform: uppercase; color: var(--white); }
  .info h2 { margin: 36px 0 12px; font-weight: 800; font-size: 22px; letter-spacing: .18em; text-transform: uppercase; color: var(--celeste); }
  .info p { margin: 0 0 14px; max-width: 820px; }
  .info b { color: var(--white); font-weight: 800; }
  .info a { color: var(--white); text-decoration-color: var(--pink); text-underline-offset: 3px; }
  .info a:hover { color: var(--pink); }
  .i-tz { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .i-tz li { background: var(--card); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
  .i-tz li > b { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--celeste); }
  .i-tz span { font-size: 18px; }
  .i-cal { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; }
  .i-cal li { background: var(--card); padding: 10px 14px; display: flex; flex-direction: column; }
  .i-cal li[aria-current] { background: var(--card-2); box-shadow: inset 4px 0 var(--pink); }
  .i-cal span { font-size: 16px; letter-spacing: .06em; color: var(--celeste); }
  .i-src { margin-top: 30px !important; font-size: 15px; color: #6F8BB0; }

  @media (max-width: 480px) {
    .info { font-size: 18px; }
    .info h1 { font-size: 32px; }
    .i-tz { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg button { padding: 0 10px; font-size: 14px; letter-spacing: .06em; }
    .where-gp { font-size: 18px; }
    .where-meta { font-size: 12px; letter-spacing: .08em; white-space: nowrap; }
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="poster" id="poster"><!--poster--><!--/poster--></div>
  </div>
  <article class="info" id="info"><!--info--><!--/info--></article>
</main>

<nav aria-label="Grandes Premios">
  <div class="seg" id="seg" role="group" aria-label="Ver">
    <button type="button" id="segRes" aria-pressed="true">RESULTADOS</button>
    <button type="button" id="segSch" aria-pressed="false">HORARIOS</button>
    <button type="button" id="segTab" aria-pressed="false">TABLA</button>
    <button type="button" id="segSea" aria-pressed="false">TEMPORADA</button>
  </div>
  <div class="ctrls">
  <button id="prev" type="button" aria-label="Gran Premio anterior">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="where">
    <div class="where-gp" id="whereGp"></div>
    <div class="where-meta" id="whereMeta"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
  <button id="next" type="button" aria-label="Gran Premio siguiente">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  </div>
</nav>

<script src="/races.js"></script>
<script src="/results.js"></script>
<script src="/poster.js"></script>
<script src="/seo.js"></script>
<script>
const RACES = window.RACES;
const P = window.Poster;
const weekend = P.state.weekend;

const $ = (id) => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), poster = $('poster');
const now = Date.now();
const upcomingIdx = (() => {
  const i = RACES.findIndex((r) => Date.parse(r.end) > now);
  return i === -1 ? RACES.length - 1 : i;
})();
let idx = upcomingIdx;

$('dots').innerHTML = RACES.map(() => '<span></span>').join('');

// Tres formatos de placa:
//   'm' celular (angosto y alto): 720 de ancho, estirada a lo alto para llenar la pantalla.
//   'd' pantalla angosta: la placa original de 1080 × 1350.
//   'w' computadora: la placa toma el ancho de la pantalla y se arma en dos columnas.
let mode = null;
let posterW = 1080, baseH = 1350, scale = 1;
const PAD_W = 110, GAP_W = 100;
const mobile = () => mode === 'm';
// Ancho útil para los gráficos: el de una columna en pantalla ancha.
const contentW = () => mode === 'w' ? (posterW - 2 * PAD_W - GAP_W) / 2 : posterW - (mode === 'm' ? 80 : 160);
// Si el contenido no entra en la placa, la placa crece hacia abajo y se puede scrollear.
function relayout() {
  const c = poster.querySelector('.content');
  // Con las líneas decorativas (placa de horarios) hace falta más aire abajo.
  const extra = poster.querySelector('.lines') ? 300 : (mobile() ? 150 : 170);
  const need = c ? Math.ceil(c.offsetTop + c.offsetHeight + extra) : 0;
  const H = Math.max(baseH, need);
  poster.style.height = H + 'px';
  frame.style.height = H * scale + 'px';
}
function paint(html) { poster.innerHTML = html; relayout(); }
function fit() {
  const cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = stage.clientHeight - parseFloat(cs.paddingTop);
  const tallH = h / (w / 720);
  const m = w < 700 && tallH >= 1300 ? 'm' : (w >= 1000 && w / h > 1.15) ? 'w' : 'd';
  let W, H, s;
  if (m === 'w') {
    W = Math.round(Math.min(2500, Math.max(1700, 1150 * w / h)));
    s = w / W;
    H = Math.max(1000, Math.floor(h / s));
  } else {
    W = m === 'm' ? 720 : 1080;
    H = m === 'm' ? Math.min(1800, Math.floor(tallH)) : 1350;
    s = Math.max(0.1, Math.min(w / W, h / H));
  }
  poster.style.width = W + 'px';
  poster.style.height = H + 'px';
  frame.style.width = W * s + 'px';
  frame.style.height = H * s + 'px';
  poster.style.transform = `scale(${s})`;
  const changed = m !== mode || W !== posterW;
  const first = mode === null;
  posterW = W; baseH = H; scale = s; mode = m;
  P.state.W = W;
  poster.classList.toggle('m', m === 'm');
  poster.classList.toggle('w', m === 'w');
  relayout();
  if (changed && !first) show(idx, false);   // el diseño depende del ancho
}

function status(i) {
  if (Date.parse(RACES[i].end) <= now) return 'Finalizado';
  if (i === upcomingIdx) return '<b>Próxima carrera</b>';
  return 'Próximamente';
}

const finished = (r) => Date.parse(r.end) <= now;
let view = 'gp';        // 'gp' (resultados si terminó, si no horarios), 'schedule', 'standings' o 'season'
let token = 0;          // evita que una respuesta lenta pise otro GP

// ---------- direcciones: /, /gp/<id>, /tabla, /temporada ----------
let home = false;       // en "/" se ve la próxima carrera
function route() {
  const p = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
  const gp = /^\/gp\/([a-z0-9-]+)$/.exec(p);
  const byHash = RACES.findIndex((r) => '#' + r.id === location.hash);   // links viejos (#las-vegas)
  if (gp && RACES.some((r) => r.id === gp[1])) return { idx: RACES.findIndex((r) => r.id === gp[1]), view: 'gp' };
  if (p === '/tabla') return { idx: upcomingIdx, view: 'standings' };
  if (p === '/temporada') return { idx: upcomingIdx, view: 'season' };
  if (byHash !== -1) return { idx: byHash, view: 'gp' };
  return { idx: upcomingIdx, view: 'gp', home: true };
}
const pathOf = () => view === 'standings' ? '/tabla' : view === 'season' ? '/temporada' : home ? '/' : '/gp/' + RACES[idx].id;

// ---------- información debajo de la placa (también la lee Google) ----------
const info = { race: {}, standings: null, season: null };
function renderInfo() {
  const r = RACES[idx];
  const kind = view === 'standings' ? 'tabla' : view === 'season' ? 'temporada' : home ? 'home' : 'gp';
  const p = window.Seo.page(kind, r, { race: info.race[r.id], weekend: weekend[r.id], standings: info.standings, season: info.season });
  $('info').innerHTML = window.Seo.section(p);
  document.title = p.title;
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute('content', p.description);
  const c = document.querySelector('link[rel="canonical"]');
  if (c) c.setAttribute('href', new URL(p.path, c.href).href);
}

function setView(v) {
  view = v;
  home = false;
  show(idx, true);
}
$('segRes').addEventListener('click', () => setView('gp'));
$('segSch').addEventListener('click', () => setView('schedule'));
$('segTab').addEventListener('click', () => setView('standings'));
$('segSea').addEventListener('click', () => setView('season'));

function renderSeason() {
  const my = ++token;
  paint(P.seasonShell(P.seasonHead() + P.msgBlock('Cargando<br>temporada…')));
  window.Results.loadSeason().then((d) => {
    if (my !== token) return;
    if (!d) { paint(P.seasonShell(P.seasonHead() + P.msgBlock('Datos no<br>disponibles', 'Probá de nuevo en un rato.'))); return; }
    info.season = d; renderInfo();
    paint(P.season(d, { width: contentW() }));
  }).catch(() => {
    if (my !== token) return;
    paint(P.seasonShell(P.seasonHead() + P.msgBlock('Sin conexión<br>con los datos', 'Probá de nuevo en un rato.')));
  });
}

function renderStandings() {
  const my = ++token;
  paint(P.standingsShell(P.standingsHead() + P.msgBlock('Cargando<br>tabla…')));
  window.Results.loadStandings().then((d) => {
    if (my !== token) return;
    if (!d) { paint(P.standingsShell(P.standingsHead() + P.msgBlock('Tabla no<br>disponible', 'Probá de nuevo en un rato.'))); return; }
    info.standings = d; renderInfo();
    paint(P.standings(d, { twoCols: !mobile(), wide: mode === 'w' }));
  }).catch(() => {
    if (my !== token) return;
    paint(P.standingsShell(P.standingsHead() + P.msgBlock('Sin conexión<br>con los datos', 'Probá de nuevo en un rato.')));
  });
}

function renderSchedule(r) { paint(P.schedule(r)); }
// Trae el resultado de Franco en las sesiones ya corridas y, si cambió, vuelve a dibujar.
function refreshWeekend(r) {
  const ss = window.sessionsOf(r);
  if (!ss.length || ss[0].at > Date.now()) return;
  window.Results.loadWeekend(r).then((w) => {
    if (!w || JSON.stringify(w) === JSON.stringify(weekend[r.id])) return;
    weekend[r.id] = w;
    if (RACES[idx] !== r) return;
    renderInfo();
    if (poster.querySelector('.days')) { const y = stage.scrollTop; renderSchedule(r); stage.scrollTop = y; }
  }).catch(() => {});
}

function renderResults(r) {
  const my = ++token;
  paint(P.message(r, 'Cargando<br>resultados…', 'Buscando los datos de la carrera.'));
  window.Results.load(r).then((data) => {
    if (my !== token) return;
    if (!data) {
      paint(P.message(r, 'Resultados<br>en camino',
        'Los datos oficiales suelen aparecer unas horas después de la bandera a cuadros. Volvé a entrar más tarde.'));
      return;
    }
    info.race[r.id] = data; renderInfo();
    paint(P.results(r, data, { width: contentW(), chartH: mode === 'w' ? 230 : 0 }));
  }).catch(() => {
    if (my !== token) return;
    paint(P.message(r, 'Sin conexión<br>con los datos', 'No pudimos cargar los resultados. Probá de nuevo en un rato.'));
  });
}

function show(i, push) {
  idx = Math.max(0, Math.min(RACES.length - 1, i));
  stage.scrollTop = 0;
  const r = RACES[idx];
  const done = finished(r);
  if (view === 'schedule' && !r.days) view = 'gp';
  const mode2 = (view === 'standings' || view === 'season') ? view : (done && view === 'gp') ? 'results' : 'schedule';
  $('segRes').hidden = !done;
  $('segSch').hidden = !r.days;
  $('segRes').setAttribute('aria-pressed', String(mode2 === 'results'));
  $('segSch').setAttribute('aria-pressed', String(mode2 === 'schedule'));
  $('segTab').setAttribute('aria-pressed', String(mode2 === 'standings'));
  $('segSea').setAttribute('aria-pressed', String(mode2 === 'season'));
  if (mode2 === 'standings') renderStandings();
  else if (mode2 === 'season') renderSeason();
  else if (mode2 === 'results') renderResults(r);
  else { token++; renderSchedule(r); }
  if (r.days) refreshWeekend(r);
  $('whereGp').textContent = r.gp;
  $('whereMeta').innerHTML = `FECHA ${r.round} DE 23 · ${status(idx).toUpperCase()}`;
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === idx));
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === RACES.length - 1;
  if (push && location.pathname + location.hash !== pathOf()) history.replaceState(null, '', pathOf());
  renderInfo();
}

function go(i) { if (view === 'standings' || view === 'season') view = 'gp'; home = false; show(i, true); }
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
});

// Sin zoom: bloquea el pellizco y el doble toque (Safari en iPhone ignora user-scalable=no).
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const t = Date.now();
  if (t - lastTap < 350) {
    // Toque rápido seguido: evitamos el zoom pero igual cuenta como click en las flechas.
    e.preventDefault();
    const btn = e.target.closest && e.target.closest('button');
    if (btn && !btn.disabled) btn.click();
  }
  lastTap = t;
}, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());

let x0 = null;
let y0 = null;
stage.addEventListener('touchstart', (e) => {
  // En el texto de abajo no se cambia de carrera deslizando.
  if (e.target.closest('.info')) { x0 = null; return; }
  x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
}, { passive: true });
stage.addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  // Solo cuenta como cambio de carrera si el gesto es claramente horizontal (no al scrollear).
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1));
  x0 = null;
});

const start = route();
view = start.view; home = !!start.home;
fit();
show(start.idx, !!location.hash);
// La temporada completa el calendario de abajo con el resultado de cada fecha.
window.Results.loadSeason().then((d) => { if (d) { info.season = d; renderInfo(); } }).catch(() => {});
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(fit, 120); });
window.addEventListener('hashchange', () => {
  const i = RACES.findIndex((r) => '#' + r.id === location.hash);
  if (i !== -1) go(i);
});
setInterval(() => {
  const el = poster.querySelector('.cd');
  if (!el) return;
  const r = RACES[idx];
  const nx = P.nextSession(r);
  const key = nx ? nx.key + (nx.live ? '-live' : '') : '';
  if (key !== el.getAttribute('data-key')) { const y = stage.scrollTop; renderSchedule(r); stage.scrollTop = y; refreshWeekend(r); return; }
  if (!nx.live) $('cdTime').textContent = P.fmtLeft(nx.at - Date.now());
}, 1000);
// Durante el fin de semana, cada 3 minutos se fija si ya está el resultado de la última sesión.
setInterval(() => {
  const r = RACES[idx];
  if (r.days && window.Results.inWeekend(r)) refreshWeekend(r);
}, 180000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
</script>
</body>
</html>
